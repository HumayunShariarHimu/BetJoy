<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BetJoy - Smart Live Betting Coach</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: black;
    color: #00ffc6;
    max-width: 800px;
    margin: auto;
    padding: 20px;
    text-align: center;
  }
  h1, h2 {
    margin-bottom: 10px;
    text-shadow: 0 0 3px #00ffc6, 0 0 5px #00aa
  }
  label {
    display: block;
    margin-top: 20px;
    font-weight: bold;
    text-shadow: 0 0 5px #00aaff;
    font-size: 1.1em;
  }
  input, select {
    width: 80%;
    padding: 12px;
    margin-top: 8px;
    background: #1c1c1c;
    color: #00ffc6;
    border: 1px solid #00aaff;
    border-radius: 8px;
    outline: none;
    transition: all 0.3s ease;
    font-size: 1em;
  }
  input:focus, select:focus {
    box-shadow: 0 0 10px #00ffc6, 0 0 20px #00aaff;
  }
  button {
    margin-top: 25px;
    width: 60%;
    padding: 16px;
    background: linear-gradient(90deg,#00ffc6,#00aaff);
    color: #000;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-shadow: 0 0 5px #fff;
    font-size: 1.1em;
    transition: all 0.3s ease;
  }
  button:hover {
    background: linear-gradient(90deg,#00aaff,#00ffc6);
    box-shadow: 0 0 20px #00ffc6, 0 0 30px #00aaff;
    transform: scale(1.08);
  }
  .result, .history, .stats, .advice {
    background: #1a1a1a;
    margin-top: 25px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 15px #00ffc6;
    text-align: left;
    font-size: 1em;
  }
  .step {
    background: #262626;
    margin-bottom: 12px;
    padding: 12px;
    border-radius: 8px;
    box-shadow: 0 0 8px #00aaff;
  }
  footer {
    margin-top: 50px;
    color: #00aaff;
    text-shadow: 0 0 7px #00ffc6;
    font-size: 14px;
    font-style: italic;
  }
  /* Glowing hover for inputs and selects */
  input:hover, select:hover {
    border-color: #00ffc6;
    box-shadow: 0 0 12px #00ffc6;
  }
</style>
</head>
<body>

<h1>BetJoy</h1>
<h2>Smart Live Betting Coach</h2>
<br>
<label for="balance">Total Balance (৳):</label>
<input type="number" id="balance" placeholder="e.g., 10000" min="1" />

<label for="targetProfit">Target Profit (৳):</label>
<input type="number" id="targetProfit" placeholder="e.g., 1500" min="1" />

<label for="stopLoss">Stop Loss (৳):</label>
<input type="number" id="stopLoss" placeholder="e.g., 3000" min="1" />

<button onclick="startBetting()">Start Coaching</button>
<button onclick="resetAll()" style="background:#ff004d; margin-top:10px;">Reset</button>

<div class="result" id="planArea"></div>

<h3 style="text-shadow:0 0 5px #00aaff; margin-top:40px;">Bet Result:</h3>
<select id="lastResult">
  <option value="win">Won</option>
  <option value="lose">Lost</option>
</select>
<button onclick="nextBet()">Calculate Next Bet</button>

<div class="result" id="nextBetArea"></div>
<div class="stats" id="statsArea"></div>
<div class="advice" id="adviceArea"></div>
<div class="history" id="historyArea"></div>

<footer>© Humayun Shariar Himu</footer>

<script>
let history = [];
let step = 0;
let balance = 0;
let targetProfit = 0;
let stopLoss = 0;
let cumulativeLoss = 0;
let profit = 0;
let wins = 0;
let losses = 0;
let currentStreak = 0; // positive for wins, negative for losses

// Start the betting session
function startBetting() {
  balance = +document.getElementById('balance').value;
  targetProfit = +document.getElementById('targetProfit').value;
  stopLoss = +document.getElementById('stopLoss').value;

  if (!balance || !targetProfit || !stopLoss || balance <= 0 || targetProfit <= 0 || stopLoss <= 0) {
    alert('⚠️ Please fill all fields with positive numbers!');
    return;
  }
  
  step = 0;
  cumulativeLoss = 0;
  profit = 0;
  wins = 0;
  losses = 0;
  currentStreak = 0;
  history = [];
  
  document.getElementById('historyArea').innerHTML = '';
  document.getElementById('statsArea').innerHTML = '';
  document.getElementById('adviceArea').innerHTML = '';
  document.getElementById('planArea').innerHTML = '';
  document.getElementById('nextBetArea').innerHTML = '';
  
  showNextBet();
  showStats();
  showAdvice("Let's start! Keep calm and follow the plan carefully.");
}

// Process the last bet result and calculate the next bet
function nextBet() {
  if (history.length === 0) {
    alert('⚠️ Please start coaching first!');
    return;
  }
  let result = document.getElementById('lastResult').value;
  let last = history[history.length - 1];

  if (result === 'lose') {
    cumulativeLoss += +last.amount;
    profit -= +last.amount;
    losses++;
    currentStreak = (currentStreak > 0) ? -1 : currentStreak - 1;
  } else {
    cumulativeLoss = 0;
    profit += +last.amount;
    wins++;
    currentStreak = (currentStreak < 0) ? 1 : currentStreak + 1;
  }

  step = (result === 'lose') ? step + 1 : 0;

  showNextBet();
  showStats();
  showAdvice(getMentalTip());
}

// Show next bet suggestion and reasoning
function showNextBet() {
  if (cumulativeLoss >= stopLoss) {
    document.getElementById('planArea').innerHTML = '<p style="color:#ff004d;"><strong>🛑 Stop Loss reached!</strong> Better stop betting today and analyze your strategy.</p>';
    return;
  }
  if (profit >= targetProfit) {
    document.getElementById('planArea').innerHTML = '<p style="color:#00ff6a;"><strong>✅ Target profit achieved!</strong> Time to stop and enjoy your winnings.</p>';
    return;
  }

  let amount = calculateBetAmount();
  let reason = explainReason(amount);
  let tip = getMentalTip();

  history.push({ step: step + 1, amount, reason, profit });

  let html = `<h3 style="text-shadow:0 0 8px #00ffc6;">Next Bet Plan:</h3>
    <div class='step'><strong>Bet #${step + 1}:</strong> ৳${amount}<br><em>Reason: ${reason}</em></div>
    <p>Total Profit/Loss so far: ৳${profit}</p>
    <h4 style="text-shadow:0 0 6px #00aaff;">Tip:</h4><p>${tip}</p>`;
  document.getElementById('planArea').innerHTML = html;
  showHistory();
}

// Calculate the amount for the next bet based on current step
function calculateBetAmount() {
  // Start with 3% of balance
  let base = balance * 0.03;
  // Increase bet exponentially after each loss, capped at 25% of balance
  let next = base * Math.pow(1.4, step);
  if (next > balance * 0.25) next = balance * 0.25;
  return Math.ceil(next);
}

// Explain reasoning for the bet amount
function explainReason(amount) {
  if (step === 0) return 'Starting safe with a small risk.';
  if (step === 1) return 'Trying to recover last loss while staying safe.';
  if (step > 1) return 'Controlled recovery after consecutive losses to avoid over-chasing.';
  return 'Strategic adjustment.';
}

// Provide mental tips based on current streak and status
function getMentalTip() {
  if (step >= 2) return 'Multiple losses in a row? Take a deep breath and stay calm.';
  if (profit > 0 && currentStreak > 0) return 'You’re in profit! Consider stopping or locking your gains.';
  if (profit > 0) return 'You’re in profit; don’t get greedy.';
  if (currentStreak < 0) return 'Don’t chase losses aggressively; stick to the plan.';
  return 'Always follow the plan, not emotions.';
}

// Show betting history
function showHistory() {
  let html = '<h4 style="text-shadow:0 0 7px #00aaff;">Betting History:</h4>';
  history.forEach(item => {
    html += `<div class='step'>Bet ${item.step}: ৳${item.amount} | Total P/L: ৳${item.profit} (${item.reason})</div>`;
  });
  document.getElementById('historyArea').innerHTML = html;
}

// Show stats summary (win rate, losses, current streak)
function showStats() {
  let totalBets = wins + losses;
  let winRate = totalBets ? ((wins / totalBets) * 100).toFixed(1) : 0;
  let streakText = currentStreak === 0 ? 'No streak' :
    currentStreak > 0 ? `Winning streak: ${currentStreak}` :
    `Losing streak: ${-currentStreak}`;
  let statsHTML = `
    <h4 style="text-shadow:0 0 7px #00aaff;">Stats Summary:</h4>
    <p>Total Bets: ${totalBets}</p>
    <p>Wins: ${wins}</p>
    <p>Losses: ${losses}</p>
    <p>Win Rate: ${winRate}%</p>
    <p>${streakText}</p>
  `;
  document.getElementById('statsArea').innerHTML = statsHTML;
}

// Show advice or warnings dynamically
function showAdvice(message) {
  document.getElementById('adviceArea').innerHTML = `<h4 style="text-shadow:0 0 7px #00aaff;">Advice:</h4><p>${message}</p>`;
}

// Reset all inputs and states
function resetAll() {
  if (confirm('Are you sure you want to reset everything?')) {
    history = [];
    step = 0;
    balance = 0;
    targetProfit = 0;
    stopLoss = 0;
    cumulativeLoss = 0;
    profit = 0;
    wins = 0;
    losses = 0;
    currentStreak = 0;

    document.getElementById('balance').value = '';
    document.getElementById('targetProfit').value = '';
    document.getElementById('stopLoss').value = '';
    document.getElementById('lastResult').value = 'win';
    document.getElementById('planArea').innerHTML = '';
    document.getElementById('nextBetArea').innerHTML = '';
    document.getElementById('historyArea').innerHTML = '';
    document.getElementById('statsArea').innerHTML = '';
    document.getElementById('adviceArea').innerHTML = '';
  }
}
</script>

</body>
</html>
